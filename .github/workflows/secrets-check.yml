name: Secrets-Check
on:
  push:
    paths: ['.github/workflows/secrets-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Vorhandene Secrets (nur ja/nein, keine Werte)
        env:
          A: ${{ secrets.LEVERAGE_API_KEY }}
          B: ${{ secrets.ANTHROPIC_API_KEY }}
          C: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          D: ${{ secrets.CLASPRC_JSON }}
          E: ${{ secrets.SLACK_BOT_TOKEN }}
          F: ${{ secrets.REPORT_UPLOAD_SECRET }}
          G: ${{ secrets.LEVERAGE_API_TOKEN }}
          H: ${{ secrets.LEVERAGE_TOKEN }}
        run: |
          r=""
          for n in A:LEVERAGE_API_KEY B:ANTHROPIC_API_KEY C:CLAUDE_CODE_OAUTH_TOKEN D:CLASPRC_JSON E:SLACK_BOT_TOKEN F:REPORT_UPLOAD_SECRET G:LEVERAGE_API_TOKEN H:LEVERAGE_TOKEN; do
            v=${n%%:*}; name=${n#*:}
            if [ -n "${!v}" ]; then r="$r $name=ja"; else r="$r $name=nein"; fi
          done
          echo "::notice::$r"
