name: Fehler-Wächter
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1-5'   # Mo bis Fr 10:23 UTC (11:23 oder 12:23 Berlin), nicht auf :05 wegen ausgefallener Startzeit
permissions:
  contents: read
  actions: read
jobs:
  wachter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Täglich prüfen (montags zusätzlich Selbsttest)
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then python pipeline/wachter/wachter.py woche; else python pipeline/wachter/wachter.py; fi
