name: Ausgabe an Versand übergeben
on:
  push:
    paths: ['ausgaben/*.pdf', '.github/workflows/upload-ausgabe.yml']
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Neueste Ausgabe hochladen
        env:
          UPLOAD_URL: https://script.google.com/macros/s/AKfycbyvHha131hHSwzH0Wq55Lw0w448oPh7aENy91596Tx6wlvH1Ab8gLBPqeSfOPE9MvnZJQ/exec
          UPLOAD_SECRET: ${{ secrets.REPORT_UPLOAD_SECRET }}
        run: |
          set -e
          echo "::notice::URL gesetzt: ${#UPLOAD_URL} Zeichen, Secret gesetzt: ${#UPLOAD_SECRET} Zeichen"
          FILE=$(ls ausgaben/Immobilienhandel-Marktreport-*.pdf | sort | tail -1)
          NAME=$(basename "$FILE")
          python3 - "$FILE" "$NAME" > payload.json << 'PY'
          import base64, json, sys
          print(json.dumps({"name": sys.argv[2], "data": base64.b64encode(open(sys.argv[1], "rb").read()).decode()}))
          PY
          for i in 1 2 3; do
            RES=$(curl -sS -L -w "\nHTTP %{http_code} nach %{num_redirects} Redirects" -H "Content-Type: application/json" --data @payload.json "$UPLOAD_URL?upload=1&key=$UPLOAD_SECRET" 2>&1 || true)
            echo "::notice::Versuch $i: $(echo "$RES" | tr '\n' ' ' | head -c 400)"
            echo "$RES" | grep -q '"ok":true' && exit 0
            sleep $((i*20))
          done
          echo "Upload fehlgeschlagen" && exit 1
